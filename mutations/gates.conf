# Mutation spec for profilefield_repeatable — run with `mdl mutate moodle-profilefield_repeatable mutations/gates.conf`.
#
# Each gate breaks ONE guard and names the test(s) that must go red because of it. A gate with no
# `->` line is one the author expects NO test (or no test on every database) to hold: its result is
# the finding, not a pass. Gates marked `# PG only` are held by tests that skip off PostgreSQL, so a
# MariaDB sweep reddens nothing for them by design; read them from the --db pgsql sweep.
#
#     tag | file relative to the repo | perl script relative to this file
#
# The gates of the code that moved to local_repeatable (schema, payload, SQL, validator, bridges,
# stored values, privacy exporter, edit widget, column editor, sets renderer, projection writer and the
# abstract Report Builder entity) live in that repository's mutations/gates.conf, under the same tags.

